<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="100%" height="100%" style="background-color: #0f172a; font-family: 'Segoe UI', Arial, sans-serif;">
  <defs>
    <!-- Grid Pattern -->
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <!-- Drop Shadow -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#090d16"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- Title & Header Banner -->
  <rect x="30" y="20" width="1140" height="65" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="50" y="48" fill="#38bdf8" font-size="18" font-weight="bold" letter-spacing="1">RAILWAY LEVEL CROSSING &amp; TRAIN TRAFFIC CONTROLLER</text>
  <text x="50" y="70" fill="#94a3b8" font-size="12">COMPLETE HARDWARE WIRING &amp; ELECTRICAL CIRCUIT SCHEMATIC | COURSE: UE25EC2302</text>
  <text x="1000" y="58" fill="#e2e8f0" font-size="11" font-weight="bold" text-anchor="end">GM UNIVERSITY - DEPT OF ECE</text>

  <!-- ========================================================================= -->
  <!-- 1. CENTRAL CONTROLLER (ARDUINO UNO / FPGA GPIO)                           -->
  <!-- ========================================================================= -->
  <g transform="translate(420, 220)">
    <!-- Board Base -->
    <rect x="0" y="0" width="360" height="480" rx="12" fill="#0284c7" stroke="#38bdf8" stroke-width="2.5" filter="url(#shadow)"/>
    <rect x="10" y="10" width="340" height="460" rx="8" fill="#0369a1"/>
    
    <!-- Board Title -->
    <text x="180" y="40" fill="#ffffff" font-size="16" font-weight="bold" text-anchor="middle">CONTROLLER BOARD</text>
    <text x="180" y="58" fill="#bae6fd" font-size="11" text-anchor="middle">Arduino Uno R3 / Basys 3 FPGA</text>

    <!-- Microcontroller Chip -->
    <rect x="120" y="180" width="120" height="150" rx="4" fill="#0f172a" stroke="#475569" stroke-width="2"/>
    <text x="180" y="250" fill="#94a3b8" font-size="12" font-weight="bold" text-anchor="middle">ATmega328P</text>
    <text x="180" y="268" fill="#64748b" font-size="9" text-anchor="middle">FSM Controller</text>

    <!-- USB & DC Jack -->
    <rect x="15" y="-10" width="50" height="40" rx="2" fill="#94a3b8" stroke="#475569"/>
    <text x="40" y="15" fill="#0f172a" font-size="8" font-weight="bold" text-anchor="middle">USB</text>
    <rect x="290" y="-15" width="45" height="50" rx="4" fill="#1e293b" stroke="#000000"/>

    <!-- DIGITAL HEADER (LEFT SIDE) -->
    <g transform="translate(15, 80)">
      <text x="0" y="-10" fill="#e0f2fe" font-size="10" font-weight="bold">DIGITAL I/O (PWM)</text>
      <!-- Pin D2 -->
      <circle cx="10" cy="20" r="5" fill="#22c55e"/>
      <text x="25" y="24" fill="#ffffff" font-size="11" font-weight="bold">D2 (S1: Entry Sensor)</text>
      <!-- Pin D3 -->
      <circle cx="10" cy="50" r="5" fill="#22c55e"/>
      <text x="25" y="54" fill="#ffffff" font-size="11" font-weight="bold">D3 (S2: Track Occupancy)</text>
      <!-- Pin D4 -->
      <circle cx="10" cy="80" r="5" fill="#ef4444"/>
      <text x="25" y="84" fill="#ffffff" font-size="11">D4 (Road RED Light)</text>
      <!-- Pin D5 -->
      <circle cx="10" cy="110" r="5" fill="#f59e0b"/>
      <text x="25" y="114" fill="#ffffff" font-size="11">D5 (Road YELLOW Light)</text>
      <!-- Pin D6 -->
      <circle cx="10" cy="140" r="5" fill="#10b981"/>
      <text x="25" y="144" fill="#ffffff" font-size="11">D6 (Road GREEN Light)</text>
      <!-- Pin D7 -->
      <circle cx="10" cy="170" r="5" fill="#22c55e"/>
      <text x="25" y="174" fill="#ffffff" font-size="11" font-weight="bold">D7 (S3: Exit Sensor)</text>
      <!-- Pin D8 -->
      <circle cx="10" cy="200" r="5" fill="#ec4899"/>
      <text x="25" y="204" fill="#ffffff" font-size="11">D8 (Piezo Buzzer +)</text>
      <!-- Pin D9 -->
      <circle cx="10" cy="230" r="5" fill="#f97316"/>
      <text x="25" y="234" fill="#ffffff" font-size="11" font-weight="bold">D9 (PWM: North Servo)</text>
      <!-- Pin D10 -->
      <circle cx="10" cy="260" r="5" fill="#f97316"/>
      <text x="25" y="264" fill="#ffffff" font-size="11" font-weight="bold">D10 (PWM: South Servo)</text>
      <!-- Pin D12 -->
      <circle cx="10" cy="290" r="5" fill="#ef4444"/>
      <text x="25" y="294" fill="#ffffff" font-size="11">D12 (Crossbuck Left LED)</text>
      <!-- Pin D13 -->
      <circle cx="10" cy="320" r="5" fill="#ef4444"/>
      <text x="25" y="324" fill="#ffffff" font-size="11">D13 (Crossbuck Right LED)</text>
      <!-- GND -->
      <circle cx="10" cy="350" r="5" fill="#000000" stroke="#ffffff"/>
      <text x="25" y="354" fill="#cbd5e1" font-size="11">GND (Digital Ground)</text>
    </g>

    <!-- ANALOG & POWER HEADER (RIGHT SIDE) -->
    <g transform="translate(345, 120)">
      <text x="-10" y="-10" fill="#e0f2fe" font-size="10" font-weight="bold" text-anchor="end">ANALOG / SENSORS</text>
      <!-- A0 -->
      <circle cx="-10" cy="20" r="5" fill="#f43f5e"/>
      <text x="-25" y="24" fill="#ffffff" font-size="11" text-anchor="end">A0 (Manual Emergency)</text>
      <!-- A1 -->
      <circle cx="-10" cy="60" r="5" fill="#f43f5e"/>
      <text x="-25" y="64" fill="#ffffff" font-size="11" text-anchor="end">A1 (Obstacle Sensor)</text>
      <!-- A2 -->
      <circle cx="-10" cy="100" r="5" fill="#10b981"/>
      <text x="-25" y="104" fill="#ffffff" font-size="11" text-anchor="end">A2 (Train Signal GREEN)</text>
      <!-- A3 -->
      <circle cx="-10" cy="140" r="5" fill="#ef4444"/>
      <text x="-25" y="144" fill="#ffffff" font-size="11" text-anchor="end">A3 (Train Signal RED)</text>

      <text x="-10" y="190" fill="#fde047" font-size="10" font-weight="bold" text-anchor="end">POWER SUPPLY</text>
      <!-- 5V -->
      <circle cx="-10" cy="220" r="5" fill="#ef4444"/>
      <text x="-25" y="224" fill="#fca5a5" font-size="11" font-weight="bold" text-anchor="end">+5V (Logic Power)</text>
      <!-- GND -->
      <circle cx="-10" cy="260" r="5" fill="#000000" stroke="#ffffff"/>
      <text x="-25" y="264" fill="#cbd5e1" font-size="11" text-anchor="end">GND (Power Ground)</text>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- 2. TRACK SENSORS SECTION (LEFT COLUMN)                                    -->
  <!-- ========================================================================= -->
  <g transform="translate(40, 110)">
    <text x="0" y="0" fill="#38bdf8" font-size="14" font-weight="bold">[1] TRACK SENSORS (INFRARED LM393)</text>
    
    <!-- Sensor 1: Entry -->
    <g transform="translate(0, 20)">
      <rect x="0" y="0" width="280" height="85" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
      <text x="15" y="22" fill="#60a5fa" font-size="12" font-weight="bold">SENSOR 1: ENTRY (INBOUND)</text>
      <text x="15" y="38" fill="#94a3b8" font-size="10">Mount: 20cm before crossing</text>
      <circle cx="20" cy="60" r="4" fill="#ef4444"/><text x="30" y="63" fill="#f87171" font-size="9">VCC (+5V)</text>
      <circle cx="100" cy="60" r="4" fill="#000000" stroke="#94a3b8"/><text x="110" y="63" fill="#cbd5e1" font-size="9">GND</text>
      <circle cx="170" cy="60" r="4" fill="#22c55e"/><text x="180" y="63" fill="#86efac" font-size="9" font-weight="bold">OUT -&gt; D2</text>
    </g>

    <!-- Sensor 2: Track Occupancy -->
    <g transform="translate(0, 125)">
      <rect x="0" y="0" width="280" height="85" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
      <text x="15" y="22" fill="#60a5fa" font-size="12" font-weight="bold">SENSOR 2: TRACK OCCUPANCY</text>
      <text x="15" y="38" fill="#94a3b8" font-size="10">Mount: Directly inside crossing zone</text>
      <circle cx="20" cy="60" r="4" fill="#ef4444"/><text x="30" y="63" fill="#f87171" font-size="9">VCC (+5V)</text>
      <circle cx="100" cy="60" r="4" fill="#000000" stroke="#94a3b8"/><text x="110" y="63" fill="#cbd5e1" font-size="9">GND</text>
      <circle cx="170" cy="60" r="4" fill="#22c55e"/><text x="180" y="63" fill="#86efac" font-size="9" font-weight="bold">OUT -&gt; D3</text>
    </g>

    <!-- Sensor 3: Exit Departure -->
    <g transform="translate(0, 230)">
      <rect x="0" y="0" width="280" height="85" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
      <text x="15" y="22" fill="#60a5fa" font-size="12" font-weight="bold">SENSOR 3: EXIT (OUTBOUND)</text>
      <text x="15" y="38" fill="#94a3b8" font-size="10">Mount: 20cm after crossing</text>
      <circle cx="20" cy="60" r="4" fill="#ef4444"/><text x="30" y="63" fill="#f87171" font-size="9">VCC (+5V)</text>
      <circle cx="100" cy="60" r="4" fill="#000000" stroke="#94a3b8"/><text x="110" y="63" fill="#cbd5e1" font-size="9">GND</text>
      <circle cx="170" cy="60" r="4" fill="#22c55e"/><text x="180" y="63" fill="#86efac" font-size="9" font-weight="bold">OUT -&gt; D7</text>
    </g>

    <!-- Sensor 4: Obstacle Sensor -->
    <g transform="translate(0, 335)">
      <rect x="0" y="0" width="280" height="85" rx="6" fill="#1e293b" stroke="#f43f5e" stroke-width="1.5"/>
      <text x="15" y="22" fill="#fb7185" font-size="12" font-weight="bold">SENSOR 4: STALLED OBSTACLE</text>
      <text x="15" y="38" fill="#94a3b8" font-size="10">Mount: Facing road crossing tracks</text>
      <circle cx="20" cy="60" r="4" fill="#ef4444"/><text x="30" y="63" fill="#f87171" font-size="9">VCC (+5V)</text>
      <circle cx="100" cy="60" r="4" fill="#000000" stroke="#94a3b8"/><text x="110" y="63" fill="#cbd5e1" font-size="9">GND</text>
      <circle cx="170" cy="60" r="4" fill="#f43f5e"/><text x="180" y="63" fill="#fca5a5" font-size="9" font-weight="bold">OUT -&gt; A1</text>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- 3. ACTUATORS & SERVOS SECTION (BOTTOM LEFT)                               -->
  <!-- ========================================================================= -->
  <g transform="translate(40, 565)">
    <text x="0" y="0" fill="#f97316" font-size="14" font-weight="bold">[2] GATE ACTUATORS (SG90 MICRO SERVOS)</text>
    
    <!-- Servo 1: North -->
    <g transform="translate(0, 20)">
      <rect x="0" y="0" width="280" height="110" rx="6" fill="#1e293b" stroke="#f97316" stroke-width="1.5"/>
      <text x="15" y="22" fill="#fb923c" font-size="12" font-weight="bold">SERVO 1: NORTH GATE BARRIER</text>
      <text x="15" y="40" fill="#94a3b8" font-size="10">Operating Angle: 90 deg (Open) -&gt; 0 deg (Closed)</text>
      <line x1="15" y1="52" x2="265" y2="52" stroke="#334155"/>
      <text x="15" y="72" fill="#f87171" font-size="10">Brown Wire -&gt; Common GND</text>
      <text x="15" y="88" fill="#ef4444" font-size="10" font-weight="bold">Red Wire -&gt; External +5V Power Supply</text>
      <text x="15" y="104" fill="#f97316" font-size="10" font-weight="bold">Orange/Yellow Wire -&gt; Pin D9 (PWM)</text>
    </g>

    <!-- Servo 2: South -->
    <g transform="translate(0, 145)">
      <rect x="0" y="0" width="280" height="110" rx="6" fill="#1e293b" stroke="#f97316" stroke-width="1.5"/>
      <text x="15" y="22" fill="#fb923c" font-size="12" font-weight="bold">SERVO 2: SOUTH GATE BARRIER</text>
      <text x="15" y="40" fill="#94a3b8" font-size="10">Operating Angle: 90 deg (Open) -&gt; 0 deg (Closed)</text>
      <line x1="15" y1="52" x2="265" y2="52" stroke="#334155"/>
      <text x="15" y="72" fill="#f87171" font-size="10">Brown Wire -&gt; Common GND</text>
      <text x="15" y="88" fill="#ef4444" font-size="10" font-weight="bold">Red Wire -&gt; External +5V Power Supply</text>
      <text x="15" y="104" fill="#f97316" font-size="10" font-weight="bold">Orange/Yellow Wire -&gt; Pin D10 (PWM)</text>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- 4. SIGNALS & WARNING SUB-SYSTEM (RIGHT COLUMN)                            -->
  <!-- ========================================================================= -->
  <g transform="translate(860, 110)">
    <text x="0" y="0" fill="#10b981" font-size="14" font-weight="bold">[3] SIGNALS &amp; AUDIBLE ALARMS</text>

    <!-- Road Traffic Light Module -->
    <g transform="translate(0, 20)">
      <rect x="0" y="0" width="300" height="150" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
      <text x="15" y="22" fill="#34d399" font-size="12" font-weight="bold">ROAD TRAFFIC LIGHT HEAD (x2)</text>
      
      <!-- Red Light -->
      <circle cx="30" cy="50" r="10" fill="#ef4444" stroke="#f87171" stroke-width="2"/>
      <text x="50" y="54" fill="#ffffff" font-size="11">RED LED (Stop): <b>Pin D4</b> via 220 ohm</text>
      
      <!-- Yellow Light -->
      <circle cx="30" cy="80" r="10" fill="#f59e0b" stroke="#fde047" stroke-width="2"/>
      <text x="50" y="84" fill="#ffffff" font-size="11">YELLOW LED (Warn): <b>Pin D5</b> via 220 ohm</text>
      
      <!-- Green Light -->
      <circle cx="30" cy="110" r="10" fill="#10b981" stroke="#6ee7b7" stroke-width="2"/>
      <text x="50" y="114" fill="#ffffff" font-size="11">GREEN LED (Go): <b>Pin D6</b> via 220 ohm</text>

      <text x="15" y="140" fill="#94a3b8" font-size="9">Cathodes (-) tied to Common Ground (GND)</text>
    </g>

    <!-- Hazard Crossbuck Flashers -->
    <g transform="translate(0, 185)">
      <rect x="0" y="0" width="300" height="100" rx="6" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
      <text x="15" y="22" fill="#f87171" font-size="12" font-weight="bold">CROSSBUCK RED WIG-WAGS (x4)</text>
      <text x="15" y="42" fill="#ffffff" font-size="10">Left LED: <b>Pin D12</b> via 220 ohm resistor</text>
      <text x="15" y="60" fill="#ffffff" font-size="10">Right LED: <b>Pin D13</b> via 220 ohm resistor</text>
      <text x="15" y="85" fill="#fca5a5" font-size="9">Alternating 800ms cadence during train passage</text>
    </g>

    <!-- Train Track Aspects -->
    <g transform="translate(0, 300)">
      <rect x="0" y="0" width="300" height="100" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="15" y="22" fill="#38bdf8" font-size="12" font-weight="bold">TRAIN TRACK SIGNALS (INTERLOCK)</text>
      <text x="15" y="45" fill="#10b981" font-size="11">[GREEN] Pin A2 (Clear: Gate = 0 deg &amp; Safe)</text>
      <text x="15" y="68" fill="#ef4444" font-size="11">[RED]   Pin A3 (Halt: Gate open or Obstacle)</text>
      <text x="15" y="90" fill="#94a3b8" font-size="9">Connect with 220 ohm resistors to GND</text>
    </g>

    <!-- Audible Piezo Buzzer -->
    <g transform="translate(0, 415)">
      <rect x="0" y="0" width="300" height="90" rx="6" fill="#1e293b" stroke="#ec4899" stroke-width="1.5"/>
      <text x="15" y="22" fill="#f472b6" font-size="12" font-weight="bold">5V ACTIVE PIEZO BUZZER</text>
      <text x="15" y="45" fill="#ffffff" font-size="11">Positive (+) Terminal -&gt; <b>Pin D8</b></text>
      <text x="15" y="65" fill="#ffffff" font-size="11">Negative (-) Terminal -&gt; <b>Common GND</b></text>
      <text x="15" y="82" fill="#cbd5e1" font-size="9">Pulsed chime during descent, solid siren on emergency</text>
    </g>

    <!-- Emergency Manual Stop Button -->
    <g transform="translate(0, 520)">
      <rect x="0" y="0" width="300" height="95" rx="6" fill="#1e293b" stroke="#f43f5e" stroke-width="1.5"/>
      <text x="15" y="22" fill="#fb7185" font-size="12" font-weight="bold">MANUAL EMERGENCY PUSH BUTTON</text>
      <text x="15" y="45" fill="#ffffff" font-size="11">Terminal 1 -&gt; <b>+5V Power</b></text>
      <text x="15" y="65" fill="#ffffff" font-size="11">Terminal 2 -&gt; <b>Pin A0</b> + <b>10k ohm Resistor to GND</b></text>
      <text x="15" y="85" fill="#fda4af" font-size="9">Pressing initiates immediate emergency lockdown</text>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- 5. POWER SUPPLY ARCHITECTURE (BOTTOM CENTER)                              -->
  <!-- ========================================================================= -->
  <g transform="translate(380, 720)">
    <rect x="0" y="0" width="440" height="145" rx="8" fill="#1e293b" stroke="#eab308" stroke-width="2"/>
    <text x="20" y="28" fill="#fde047" font-size="13" font-weight="bold">[4] POWER DISTRIBUTION ARCHITECTURE</text>
    
    <text x="20" y="52" fill="#ffffff" font-size="11">- <b>Logic Supply:</b> 5V from Arduino USB / 5V regulator for Sensors &amp; LEDs.</text>
    <text x="20" y="74" fill="#f87171" font-size="11">- <b>Servo Motor Supply:</b> Dedicated <b>External 5V 2A DC Adapter</b> to prevent brownout.</text>
    <text x="20" y="96" fill="#4ade80" font-size="11">- <b>CRITICAL SAFETY RULE:</b> All Grounds (Arduino GND + External 5V GND) must be</text>
    <text x="32" y="114" fill="#4ade80" font-size="11">tied together as a <b>COMMON GROUND</b> to avoid floating logic levels.</text>

    <rect x="330" y="20" width="90" height="40" rx="4" fill="#ca8a04"/>
    <text x="375" y="44" fill="#000000" font-size="10" font-weight="bold" text-anchor="middle">5V 2A DC</text>
  </g>

  <!-- Wire Connection Lines -->
  <!-- Sensor lines to controller -->
  <path d="M 280 190 H 340 V 300 H 430" fill="none" stroke="#22c55e" stroke-width="2" stroke-dasharray="4,2"/>
  <circle cx="430" cy="300" r="3" fill="#22c55e"/>

  <!-- Actuator lines to controller -->
  <path d="M 280 640 H 360 V 510 H 430" fill="none" stroke="#f97316" stroke-width="2" stroke-dasharray="4,2"/>
  <circle cx="430" cy="510" r="3" fill="#f97316"/>

  <!-- Light lines to controller -->
  <path d="M 860 180 H 800 V 300 H 770" fill="none" stroke="#10b981" stroke-width="2" stroke-dasharray="4,2"/>
  <circle cx="770" cy="300" r="3" fill="#10b981"/>

  <!-- Emergency lines to controller -->
  <path d="M 860 670 H 810 V 420 H 770" fill="none" stroke="#f43f5e" stroke-width="2" stroke-dasharray="4,2"/>
  <circle cx="770" cy="420" r="3" fill="#f43f5e"/>

</svg>
